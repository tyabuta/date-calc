<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日付計算ツール</title>
    <meta name="description" content="2つの日付の差分日数と、日付の加減算をブラウザ上で計算します。" />
    <link rel="stylesheet" href="https://tyabuta.github.io/date-calc/style.css?h=c6742239de6b1fe4ee40" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="https://tyabuta.github.io/date-calc/">日付計算ツール</a>
      <nav>
        <a href="https://tyabuta.github.io/date-calc/about/">仕様</a>
      </nav>
    </header>

    <main>
<div class="toolbar">
  <label for="date-style">表示形式</label>
  <select id="date-style">
    <option value="ja">2026年8月1日</option>
    <option value="slash">2026/08/01</option>
    <option value="dash">2026-08-01</option>
  </select>
</div>

<section class="card">
  <h2>日数を数える</h2>
  <div class="fields">
    <div class="field">
      <label for="diff-from">開始日</label>
      <div class="input-row">
        <input type="date" id="diff-from" />
        <button type="button" class="today" data-target="diff-from" title="今日にする">今日</button>
      </div>
    </div>
    <button type="button" class="swap" id="diff-swap" title="開始日と終了日を入れ替える">⇅</button>
    <div class="field">
      <label for="diff-to">終了日</label>
      <div class="input-row">
        <input type="date" id="diff-to" />
        <button type="button" class="today" data-target="diff-to" title="今日にする">今日</button>
      </div>
    </div>
  </div>

  <div class="slider">
    <label for="diff-slider">終了日を動かす</label>
    <input type="range" id="diff-slider" step="1" />
    <output id="diff-offset" for="diff-slider"></output>
  </div>

  <output id="diff-result" class="result" aria-live="polite"></output>
</section>

<section class="card">
  <h2>日付を足し引きする</h2>
  <div class="fields">
    <div class="field">
      <label for="add-base">基準日</label>
      <div class="input-row">
        <input type="date" id="add-base" />
        <button type="button" class="today" data-target="add-base" title="今日にする">今日</button>
      </div>
    </div>
    <div class="field narrow">
      <label for="add-days">日数</label>
      <input type="number" id="add-days" value="100" step="1" min="0" />
    </div>
    <div class="field narrow">
      <label for="add-dir">向き</label>
      <select id="add-dir">
        <option value="1">後</option>
        <option value="-1">前</option>
      </select>
    </div>
  </div>

  <div class="slider">
    <label for="add-slider">日数を動かす</label>
    <input type="range" id="add-slider" min="0" step="1" />
    <output id="add-amount" for="add-slider"></output>
  </div>

  <output id="add-result" class="result" aria-live="polite"></output>
</section>

<section class="card">
  <h2>日付を調べる</h2>
  <div class="fields">
    <div class="field">
      <label for="info-date">日付</label>
      <div class="input-row">
        <input type="date" id="info-date" />
        <button type="button" class="today" data-target="info-date" title="今日にする">今日</button>
      </div>
    </div>
  </div>

  <output id="info-result" class="result" aria-live="polite"></output>
</section>

<section class="card">
  <h2>年齢を計算する</h2>
  <div class="fields">
    <div class="field">
      <label for="age-birth">生年月日</label>
      <div class="input-row">
        <input type="date" id="age-birth" />
        <button type="button" class="today" data-target="age-birth" title="今日にする">今日</button>
      </div>
    </div>
    <div class="field">
      <label for="age-on">基準日</label>
      <div class="input-row">
        <input type="date" id="age-on" />
        <button type="button" class="today" data-target="age-on" title="今日にする">今日</button>
      </div>
    </div>
  </div>

  <output id="age-result" class="result" aria-live="polite"></output>
</section>

<div class="note"><p>計算はすべてブラウザ内で完結します。入力した日付がサーバーに送られることはありません。</p>
</div>
</main>

    
<script type="module" src="https://tyabuta.github.io/date-calc/app.js?h=f6dc73c4ee60c0c8afc9"></script>

  </body>
</html>
